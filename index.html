window.liveCommand = function(comment) {
  switch (comment.trim().toLowerCase()) {
    case 'rain': rain = true; break;
    case 'clear': rain = false; break;
    case 'city': world = 0; break;
    case 'forest': world = 1; break;
    case 'coast': world = 2; break;
    case 'night': mode = 0; break;
    case 'sunset': mode = 1; break;
    case 'day': mode = 2; break;
    case 'left': $('steerL').click(); break;
    case 'right': $('steerR').click(); break;
  }
};
function connectLive() {
  const socket = new WebSocket(
    'wss://midnight-drive-live.onrender.com'
  );

  socket.onopen = () => {
    console.log('LIVE server connected');
  };

  socket.onmessage = (event) => {
    try {
      const data = JSON.parse(event.data);
      if (typeof data.command === 'string') {
        window.liveCommand(data.command);
      }
    } catch (error) {
      console.log(error);
    }
  };

  socket.onclose = () => {
    setTimeout(connectLive, 5000);
  };

  socket.onerror = () => {
    socket.close();
  };
}

connectLive();
